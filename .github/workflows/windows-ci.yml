name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

      - name: Smoke test Copilot runtime startup
        shell: pwsh
        run: |
          node -e "import { fileURLToPath } from 'node:url'; import { dirname, join, resolve } from 'node:path'; import { access } from 'node:fs/promises'; import('@github/copilot-sdk').then(async ({ CopilotClient, RuntimeConnection }) => { const variants = process.platform === 'linux' ? ['linux', 'linuxmusl'] : [process.platform]; let runtimePath; for (const variant of variants) { try { const root = dirname(fileURLToPath(import.meta.resolve('@github/copilot-' + variant + '-' + process.arch))); const candidate = join(root, 'index.js'); await access(candidate); runtimePath = candidate; break; } catch {} } if (!runtimePath) throw new Error('Copilot platform package was not found'); const client = new CopilotClient({ baseDirectory: resolve('.doc-harness', 'ci-copilot'), connection: RuntimeConnection.forStdio({ path: runtimePath }), mode: 'empty', workingDirectory: process.cwd() }); await client.start(); await client.stop(); })"

      - name: Smoke test CLI startup
        shell: pwsh
        run: |
          node dist/cli.js --runtime invalid
          if ($LASTEXITCODE -eq 0) {
            throw "CLI accepted an invalid runtime"
          }
          exit 0
